name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun tsc --noEmit

      - name: Read version
        id: meta
        run: |
          version=$(bun -e "console.log(require('./package.json').version)")
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "::error::package.json no tiene campo version"
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Versión inválida: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check existing tag
        id: check
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "El tag $TAG ya existe: se omite el release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaries
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p dist
          targets=(
            "bun-linux-x64:linux-x64"
            "bun-linux-arm64:linux-arm64"
            "bun-darwin-x64:darwin-x64"
            "bun-darwin-arm64:darwin-arm64"
            "bun-windows-x64:windows-x64.exe"
          )
          for target in "${targets[@]}"; do
            bun_target="${target%%:*}"
            asset="${target##*:}"
            echo ">> $bun_target"
            bun build src/index.ts --compile --target="$bun_target" --outfile "dist/weather-cli-$asset"
          done
          ls -lh dist

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" dist/weather-cli-* --title "$TAG" --generate-notes
